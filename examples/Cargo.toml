[package]
name = "pg2any"
description = "PostgreSQL to Any database replication tool with Change Data Capture (CDC)"
keywords = ["postgresql", "cdc", "replication", "database", "cli"]
categories = ["command-line-utilities", "database"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/pg2any"

[features]
default = ["mysql", "metrics"]
mysql = ["pg2any_lib/mysql"]
sqlserver = ["pg2any_lib/sqlserver"]
sqlite = ["pg2any_lib/sqlite"]
kafka = ["pg2any_lib/kafka"]
metrics = ["pg2any_lib/metrics"]

[dependencies]
pg2any_lib = { path = "../pg2any-lib", default-features = false }
pg_walstream = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
